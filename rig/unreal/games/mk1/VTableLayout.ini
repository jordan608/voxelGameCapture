; Mortal Kombat 1: UE4SS's vtable layout for UObject, read beside UE4SS.dll. Only these classes; the rest are
; UE4SS's own 4.27 layout. NetherRealm's 4.27 fork has two virtual functions more than stock before
; ProcessEvent: in MK12.exe the stock slot 68 is a "return 0" stub and ProcessEvent is at 70 (UEngine::Tick at 88,
; where UE4SS's scan finds it). Without this every UFunction call does nothing, and UE4SS's LoadMap hook lands on
; another function and crashes the game. Where the two sit before ProcessEvent is not known; nothing UE4SS uses
; there has been seen to need it. See docs/RESULTS.md, Mortal Kombat 1.

