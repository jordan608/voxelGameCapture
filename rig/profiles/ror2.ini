; Risk of Rain 2: settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe as voxon_capture_ue.ini and points controlFile at
; the app. BOTH halves read it -- the rig (rig/unity, a BepInEx plugin) and the ReShade add-on -- and
; re-read it about once a second. The app's Cameras tab sets the cameras, resolution, scale, distance,
; rotation and tilt through its control file; those keys here are only the starting values.
;
; Unity 2021.3 Mono, DX11, BepInEx 5. A third-person game whose threat is all round the player, which a
; volume shows natively. 30 m puts a survivor about a quarter of the display's height tall, with a fight's
; worth of ground round them (the earlier Unity rig's choice, after looking).
on=1
engine=unity      ; the rig is rig/unity; the add-on reads each camera's own depth buffer
radiusM=30        ; rig scale: metres of world from the player to the display's edge
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the player's feet (back -4, front +4)
feetZ=1.5         ; display z of the player's feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top: the threat comes from every side
faceRes=512       ; XL side faces are faceRes x faceRes/2, top faceRes x faceRes
tiltDeg=30        ; side cameras pitched down to see the ground
perspective=1     ; ordinary lenses; 0: orthographic
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=0  ; 1: the volume turns with the player's view, which points to the display's back
hz=30             ; captures a second: each camera is a full lit render, so this is the main cost
camDist=1         ; perspective: 1 is a 90-degree lens, higher a narrower one further back
followTag=Player  ; the volume follows the object with this Unity tag: Risk of Rain 2's survivor
playerModel=ModelLocator.modelTransform   ; PLAYER LOOK: the survivor's model, which the game keeps apart from its body

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=ror2

; GPU half only
pipe=voxon_capture_rig
exposureComp=-1   ; EV stops on top of the auto-exposure
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
