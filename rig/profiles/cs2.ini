; Cities: Skylines II: settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe as voxon_capture_ue.ini and points controlFile at
; the app. BOTH halves read it -- the rig (rig/unity, a BepInEx 5 plugin) and the ReShade add-on -- and
; re-read it about once a second. The app's Cameras tab sets the cameras, resolution, scale, distance,
; rotation and tilt through its control file; those keys here are only the starting values.
;
; Unity 2022.3 Mono, HDRP, the city drawn by Unity's Entities and the game's own render systems. A city watched
; from a free camera: the volume follows what the camera looks at, grows and shrinks as it zooms, turns with it, and
; stands on the ground plane - the sea level, just above the volume's floor.
on=1
engine=unity      ; the rig is rig/unity; the add-on reads each camera's own depth buffer
radiusM=750       ; rig scale: metres of world from the middle of the view to the display's edge, at followView
feetX=0           ; display x of the feet (left -4, right +4)
feetY=0           ; display y of the feet (back -4, front +4)
feetZ=1.9         ; display z of the feet (top -2, bottom +2): the sea level just above the volume's floor
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top
faceRes=512       ; XL side faces are faceRes x faceRes/2, top faceRes x faceRes
tiltDeg=30        ; side cameras pitched down to see the ground
perspective=1     ; ordinary lenses; 0: orthographic
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=1  ; the volume turns with the game's camera: what is ahead on the screen is at the display's back
hz=30             ; captures a second: each camera is a full lit render, so this is the main cost
camDist=1         ; perspective: 1 is a 90-degree lens, higher a narrower one further back
; Nobody is the player: the volume follows the view. The game's world has no colliders to look along, so the game says
; where its camera looks (the point it orbits) and where the ground is (the sea level); the volume holds radiusM of the
; world when the camera is followView metres from that point, more as it draws back, less as it closes in.
followView=1000
viewPoint=Game.CameraController, Game: m_Pivot
feetHeight=Game.Simulation.WaterSystem, Game: SeaLevel

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=cs2

; GPU half only
pipe=voxon_capture_rig
exposureComp=2.5  ; EV stops on top of the auto-exposure: middle grey reads dim on the volume
exposureMin=-24   ; the auto-exposure may darken this far: HDRP hands the rig's cameras physical light, about -13 stops
exposureMax=8
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
