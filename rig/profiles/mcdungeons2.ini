; Minecraft Dungeons II (Unreal Engine 5.6 with AngelScript, D3D12, Xbox app): settings for the capture rig.
; The cameras are a Blueprint Loader mod (tools/mcdungeons2-mod/make_mod.py), not UE4SS: the game's protection ends it
; once its code is hooked (docs/RESULTS.md 25). A Blueprint mod cannot read the app's control file: the app writes the
; rig worked out from these settings and the Cameras tab beside the game (voxon_rig.png), and the mod reads it twice a
; second. Until that file is there the mod uses make_mod.py's copy of these values (PROFILE): change both together.
on=1
radiusM=8         ; rig scale: metres of world from the player to the display's edge
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the player's feet (back -4, front +4)
feetZ=1.5         ; display z of the player's feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top
faceRes=512       ; XL side faces are faceRes x faceRes/2, top faceRes x faceRes
tiltDeg=30        ; side cameras pitched down to see the ground
perspective=1     ; ordinary lenses
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=0  ; the cube keeps to the world's axes
hz=30             ; captures a second
camDist=1         ; 1 is a 90-degree lens

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=mcdungeons2

; GPU half only
pipe=voxon_capture_rig
exposureComp=0    ; EV stops on top of the auto-exposure
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
