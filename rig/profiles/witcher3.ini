; The Witcher 3: Wild Hunt (Remastered 5.0, D3D12): settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe as voxon_capture_ue.ini and points controlFile at the app.
; The ReShade add-on reads it, and hands the rig's settings on to the rig's script in the game (addon/red3_link.hpp);
; the app's Cameras tab overrides them through its control file.
;
; The add-on hooks the game's renderer and renders the world again from each face's camera in the same frame as the
; player's view (addon/red3_native.hpp); the rig's script (rig/redengine3) says where the volume is. The faces are the
; game's own render, so their resolution is the game window's and the camera distance here is not used: each side
; camera stands back just far enough to see its whole face, its near plane on the box's face, tilted down at Geralt by
; the tilt. On a build of the game the hook does not know, the script sweeps the game's camera round the cube instead
; (one face a frame, the side cameras level).
on=1
engine=redengine3 ; the rig is rig/redengine3, a script mod; the add-on reads the game's own frames
radiusM=6         ; rig scale: metres of world from Geralt to the display's edge (Geralt about half the display's height)
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the player's feet (back -4, front +4)
feetZ=1.5         ; display z of the player's feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top: each one more render of the world a frame
faceRes=512       ; not used: the faces are the game's own frames
tiltDeg=0         ; the side cameras raised and looking down at Geralt by this much (0 level; the sweep stays level)
perspective=1
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=0  ; 1: the volume turns with the player's view, which points to the display's back
hz=30             ; volumes a second at most; the faces are rendered every game frame
red3Native=1      ; 1: the faces rendered in the player's frame (the hook); 0: the game's camera swept round the cube

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=witcher3

; GPU half only
pipe=voxon_capture_rig
exposureComp=0    ; the game's finished picture: stops of brightness on top of it
exposureMin=-1    ; the auto-exposure darkens the game's picture by at most this many stops...
exposureMax=2     ; ...and brightens it by at most this many (0 and 0: off)
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
