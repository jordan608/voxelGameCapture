; The Sims 4 (D3D11): settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe as voxon_capture_ue.ini and points controlFile at the app.
; The ReShade add-on reads it (there is no rig module: it has the game's renderer draw each face from a camera of its
; own, sims4_views.hpp) and re-reads it about once a second; the app's Cameras tab overrides it through its control file.
; The volume follows the game's camera: the point on the ground it looks at stands where the feet are put below, so the
; ground stays at that height in the display, and with turnWithPlayer the volume turns as the camera does. The faces are
; drawn only in a lot (live and build mode), not in the menus.
on=1
engine=sims4      ; no rig module: the add-on draws the faces through the game's own renderer
radiusM=8         ; rig scale: metres of world from the point the camera looks at to the display's edge
feetX=0           ; display x of that point (left -4, right +4)
feetY=0           ; display y of that point (back -4, front +4)
feetZ=1.5         ; display z of the ground under it (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top: each one more render of the lot a frame
faceRes=512       ; each face this many texels square
tiltDeg=30        ; side cameras pitched down to see the floor
perspective=1
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=1  ; the volume turns with the game's camera, whose view points to the display's back
hz=30             ; volumes a second at most

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=sims4

; GPU half only
pipe=voxon_capture_rig
exposureComp=0    ; the game's finished picture: stops of brightness on top of it
exposureMin=-1    ; the auto-exposure darkens the game's picture by at most this many stops...
exposureMax=2     ; ...and brightens it by at most this many (0 and 0: off)
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
