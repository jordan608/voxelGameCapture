; F1 2020 (Codemasters' EGO engine, D3D12): settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe as voxon_capture_ue.ini and points controlFile at the app.
; The ReShade add-on reads it (there is no rig module: the add-on puts its cameras into the game's own reflection
; cubemap, addon/ego_views.hpp) and re-reads it about once a second; the app's Cameras tab overrides it through its
; control file. The game must run on DirectX 12 with Vehicle Reflections at Ultra High (its cubemap on).
on=1
engine=ego        ; no rig module: the add-on draws the faces through the game's own cubemap
radiusM=3         ; rig scale: metres of world from the car to the display's edge (a car is 5.7 m long)
feetX=0           ; display x of the car's wheels on the track (left -4, right +4)
feetY=0           ; display y of them (back -4, front +4)
feetZ=1.5         ; display z of them (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top: five of the cubemap's six views
faceRes=512       ; the cubemap's own size decides (512 at Ultra High); this is the starting value only
tiltDeg=30        ; side cameras pitched down to see the track
perspective=1
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=1  ; the volume turns with the player's view (the game's camera), which points to the display's back
chaseDown=0.5     ; the ground under the car, this far below the centre of the game's cubemap (m)
hz=30             ; volumes a second at most

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=f1-2020

; GPU half only
pipe=voxon_capture_rig
exposureComp=0    ; stops of brightness on top of the auto-exposure (the faces are HDR, before the game's exposure)
exposureMin=-1    ; the auto-exposure darkens the picture by at most this many stops...
exposureMax=2     ; ...and brightens it by at most this many (0 and 0: off)
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
