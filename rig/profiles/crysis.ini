; Crysis (2007; CryEngine 2, 64-bit, D3D10): settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe (Bin64) as voxon_capture_ue.ini and points controlFile at the app.
; The ReShade add-on reads it (there is no rig module: the game's own 3D engine draws each face from a camera of the
; add-on's, cryengine2_views.hpp) and re-reads it about once a second; the app's Cameras tab overrides it through its
; control file. The volume stands on the player's feet, read from the game each frame; with turnWithPlayer it turns as
; the player looks round.
on=1
engine=cryengine2 ; no rig module: the add-on draws the faces through the game's own 3D engine
radiusM=10        ; rig scale: metres of world from the player to the display's edge
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the feet (back -4, front +4)
feetZ=1.5         ; display z of the feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top: each one more render of the world a frame that takes a volume
faceRes=512       ; the decode's samples a face, this many square (the face itself is the game's picture's height)
tiltDeg=30        ; side cameras pitched down to see the ground
perspective=1
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=1  ; the volume turns with the player's view, which points to the display's back
hz=30             ; volumes a second at most

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=crysis

; GPU half only
pipe=voxon_capture_rig
exposureComp=0    ; the game's finished picture: stops of brightness on top of it
exposureMin=-1    ; the auto-exposure darkens the game's picture by at most this many stops...
exposureMax=2     ; ...and brightens it by at most this many (0 and 0: off)
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
