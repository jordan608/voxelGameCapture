; Cyberpunk 2077 (2.31, D3D12): settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe as voxon_capture_ue.ini and points controlFile at the app.
; The ReShade add-on reads it, and hands the rig's settings on to the rig's script in the game (rig.txt beside the
; script, addon/red4_rtt.hpp); the app's Cameras tab overrides them through its control file.
;
; The rig's script (rig/redengine4, a Cyber Engine Tweaks mod) gives V five of the engine's own render-to-texture
; cameras, one on each face of the box round her, looking in, the near plane on the box's face; the engine renders them
; in the same frame as the player's view. Each side camera stands back just far enough to see its whole face, through a
; square lens of 90 degrees, so the camera distance here is not used; tilted, it is raised and looks down at V.
on=1
engine=redengine4 ; the rig is rig/redengine4, a Cyber Engine Tweaks mod; the add-on reads the cameras' own pictures
radiusM=6         ; rig scale: metres of world from V to the display's edge (V about half the display's height)
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the player's feet (back -4, front +4)
feetZ=1.5         ; display z of the player's feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top: each one more render of the world a frame
faceRes=512       ; each face's camera renders this many pixels square
tiltDeg=0         ; the side cameras raised and looking down at V by this much (0 level)
perspective=1
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=0  ; 1: the volume turns with the player's view, which points to the display's back
hz=30             ; volumes a second at most; the faces are rendered every game frame

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=cyberpunk2077

; GPU half only
pipe=voxon_capture_rig
exposureComp=0    ; the cameras' finished pictures: stops of brightness on top of them
exposureMin=-1    ; the auto-exposure darkens the game's picture by at most this many stops...
exposureMax=2     ; ...and brightens it by at most this many (0 and 0: off)
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
