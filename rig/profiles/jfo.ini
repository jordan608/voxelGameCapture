; Star Wars Jedi: Fallen Order (Unreal Engine 4, D3D11): settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe as voxon_capture_ue.ini and points controlFile at the app.
; BOTH halves read it -- rig.lua (the cameras, under UE4SS) and voxon_capture_ue.addon64 (the GPU decode) -- and
; re-read it about once a second; the app's Cameras tab overrides them through its control file.
; Third person, close combat and climbing: a small radius, Cal near the middle, all four sides and the top.
on=1
radiusM=6         ; rig scale: metres of world from the player to the display's edge
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the player's feet (back -4, front +4)
feetZ=1.5         ; display z of the player's feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top
faceRes=512       ; XL side faces are faceRes x faceRes/2, top faceRes x faceRes
tiltDeg=30        ; side cameras pitched down to see the ground
perspective=1     ; ordinary lenses: UE4 drops dynamic lights from orthographic captures. 0: the plugin's ortho
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=0  ; 1: the volume turns with the player's view, which points to the display's back
hz=30             ; captures a second: each camera is a full lit render, so this is the main cost
camDist=1         ; perspective: 1 is a 90-degree lens, higher a narrower one further back. Ortho: stand-off x edge
orthoAutoPlanes=-1  ; UE5 only; -1 leaves the engine alone
; see-through materials made solid for the cameras' depth (the app's See-through surfaces), paths with | between:
; the lightsaber's blade. Without it a blade lands on whatever is behind it. Not its glow card (M_Lightsaber_XPlane):
; two crossed planes, made solid they stand as a flat card round the blade.
solidMaterials=/Game/Effects/Materials/Lightsaber/M_Lightsaber.M_Lightsaber
solidOpacity=0.5    ; solid only where at least half opaque: the blade's mesh is wider than its glowing core

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=jfo

; GPU half only
pipe=voxon_capture_rig
exposureComp=-1   ; EV stops on top of the auto-exposure
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
