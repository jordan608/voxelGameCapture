; The Ascent: settings for the re-hosted VLED capture (s1-unreal; the build plan is the-ascent/PLAN.md).
; tools/install-ue-tap.ps1 -Profile ascent copies this beside the game's exe as voxon_capture_ue.ini and
; points controlFile at this machine's Voxel64.Host. BOTH halves read it -- rig.lua (the cameras) and
; voxon_capture_ue.addon64 (the GPU decode) -- and re-read it about once a second.
;
; Voxel64.Host's panel (cartridge "ascent") sets the cameras, resolution, rig scale, camera distance, rig
; rotation and tilt through its control file; those keys here are only the fallback for when the host is
; not running or is on another game.
; UE 4.26, D3D11 or D3D12, no anti-cheat. The one game this was built and orbited on (Machine C).
on=1
radiusM=12        ; rig scale: metres of world from the player to the display's edge
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the player's feet (back -4, front +4)
feetZ=1.5         ; display z of the player's feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,4       ; X+, Y+, top -- three to start
faceRes=512       ; XL side faces are faceRes x faceRes/2, top faceRes x faceRes
tiltDeg=30        ; side cameras pitched down to see the ground
perspective=1     ; ordinary lenses: UE4 drops dynamic lights from orthographic captures. 0: the plugin's ortho
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=0  ; 1: the volume turns with the player's view, which points to the display's back
hz=30             ; captures a second: each camera is a full lit render, so this is the main cost
camDist=1         ; perspective: 1 is a 90-degree lens, higher a narrower one further back. Ortho: stand-off x edge
orthoAutoPlanes=-1  ; UE5: 1 sets bAutoCalculateOrthoPlanes as the plugin does; -1 leaves the engine alone
; see-through materials made solid for the cameras' depth (the app's See-through surfaces), paths with | between:
; the hologram doors. Without them a closed door is not in the volume, and the way looks open.
solidMaterials=/Game/Models/EnvKits/Sewer01/walls/Hologram_door_red.Hologram_door_red|/Game/Models/EnvKits/Sewer01/walls/Hologram_door_green.Hologram_door_green|/Game/Models/EnvKits/Sewer01/walls/Hologram_door_blue.Hologram_door_blue

; Voxel64.Host -- install-ue-tap.ps1 fills in controlFile for the machine it runs on
controlFile=
hostGame=ascent

; GPU half only
pipe=voxon_n64    ; Voxel64.Host's pipe
exposureComp=-1   ; EV stops on top of the auto-exposure
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
