; Minecraft: Java Edition: settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this into the game's folder (.minecraft) as voxon_capture_ue.ini and points controlFile
; at the app. BOTH halves read it -- the rig (rig/minecraft, a Fabric mod) and its decode host (voxon_capture_mc.exe,
; the add-on's decoder out of the game) -- and re-read it twice a second. The app's Cameras tab sets the cameras,
; resolution, scale, distance, rotation and tilt through its control file; those keys here are only the starting values.
;
; 26.3, OpenGL or Vulkan. The faces are the game's own level render, drawn once more per face in the frame.
on=1
engine=minecraft  ; the rig is rig/minecraft; the faces are decoded by voxon_capture_mc.exe beside the game
radiusM=8         ; rig scale: metres (blocks) of world from the player to the display's edge
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the player's feet (back -4, front +4)
feetZ=1.5         ; display z of the player's feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,2,3,4   ; the four sides and the top
faceRes=512       ; XL side faces are faceRes x faceRes/2, top faceRes x faceRes
tiltDeg=30        ; side cameras pitched down to see the ground
perspective=1     ; ordinary lenses (orthographic is not drawn in Minecraft)
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=1  ; the volume turns with the player's view: what is ahead on the screen is at the display's back
hz=30             ; captures a second: each face is a full level render, so this is the main cost
camDist=1         ; perspective: 1 is a 90-degree lens, higher a narrower one further back

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=minecraft

; the decode host only
pipe=voxon_capture_rig
exposureComp=0    ; EV stops on top of the auto-exposure
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
