; Star Wars Battlefront II (2017; Frostbite, D3D11): settings for the capture rig (docs/ARCHITECTURE.md).
; The app's installer copies this beside the game's exe as voxon_capture_ue.ini and points controlFile at the app.
; The ReShade add-on reads it (there is no rig module: it puts the faces on the renderer's list of views itself,
; frostbite_views.hpp) and re-reads it about once a second; the app's Cameras tab overrides it through its control file.
; The engine draws at most three faces beyond the player's own view: the first three of those on. Play offline: the
; campaign, Instant Action or Arcade. The faces go on with F7, once in play.
on=1
engine=frostbite  ; no rig module: the add-on adds the faces as views of the engine's own
radiusM=6         ; rig scale: metres of world from the player to the display's edge
feetX=0           ; display x of the player's feet (left -4, right +4)
feetY=0           ; display y of the player's feet (back -4, front +4)
feetZ=1.5         ; display z of the player's feet (top -2, bottom +2)
boundR=4          ; VX2-XL radius
boundZ=2          ; VX2-XL half-height
faces=0,1,4       ; the right side, the side toward the viewer, and the top (the first three on are drawn)
faceRes=512       ; each face this many texels square (the engine draws face k 8 x k larger, to tell them apart)
tiltDeg=30        ; side cameras pitched down to see the ground
perspective=1
yawDeg=0          ; the whole rig turned about the vertical
turnWithPlayer=1  ; the volume turns with the player's view, which points to the display's back
hz=30             ; volumes a second at most
; The volume stands on the player's soldier, read from the game each frame. While there is none to read (dead,
; deploying), on the camera: the player this far ahead of it, level (m)...
chaseAhead=1.8
chaseLeft=0.4     ; ...this far to its left (the camera is over the right shoulder)...
chaseDown=1.85    ; ...and this far below it: the feet (measured in play, 2026-10-16)

; the app -- its installer fills these in for the PC it runs on
controlFile=
hostGame=bf2

; GPU half only
pipe=voxon_capture_rig
exposureComp=-1   ; EV stops on top of the auto-exposure (the faces are the scene's HDR colour, before the game's tone map)
mergePerUnit=56   ; one voxel per display cell (VX2-XL: 448 across); overlapping cameras otherwise add their light. 0 = off
